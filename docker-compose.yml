services:
  app:
    build: .
    container_name: desa_wonowoso_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mongodb
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/desa_wonowoso

  mongodb:
    image: mongo:latest
    container_name: desa_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: desa_wonowoso

volumes:
  mongo_data:
